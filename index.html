<!--
  ================================================================
  NOSSAS COISINHAS — controle de contas do casal
  ----------------------------------------------------------------
  Sem configurar o Firebase (FIREBASE_CONFIG vazio) o app roda em
  MODO DEMO: salva só neste aparelho. Para usar os dois juntos:

  1. Firebase Console → criar projeto → adicionar app Web → copiar
     o firebaseConfig e colar em FIREBASE_CONFIG abaixo.
  2. Authentication → Método de login → ativar "E-mail/senha".
     Em "Usuários", criar os 2 logins (você e ela).
  3. Firestore Database → criar banco → aba Regras → colar:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{doc=**} {
           allow read, write: if request.auth != null &&
             request.auth.token.email in ['SEU@EMAIL.com', 'EMAIL@DELA.com'];
         }
       }
     }

  4. Authentication → Configurações → Domínios autorizados →
     adicionar seuusuario.github.io
  5. Subir este index.html no GitHub Pages.
  ================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
:root{
  --bg:#F5EFE4; --card:#FFFCF6; --ink:#1E2230; --muted:#767887; --line:#E8DFCF;
  --accent:#E85D3A; --ok:#2E8B67; --late:#C7372F; --soft:#EFE7D8;
  --c-casa:#E0A100; --c-a:#3F5BD8; --c-b:#D6408A;
  --shadow:0 1px 0 rgba(30,34,48,.04),0 8px 20px -12px rgba(30,34,48,.28);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15151B; --card:#1F1F28; --ink:#F3EEE4; --muted:#9C9BA8; --line:#2F2F3B;
  --accent:#FF7A55; --ok:#4CC08F; --late:#FF6B5E; --soft:#272733;
  --c-casa:#F2B92B; --c-a:#7A90FF; --c-b:#FF70B2; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.35}
body{min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* topo */
header{padding:calc(14px + env(safe-area-inset-top)) 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:25px;letter-spacing:-.6px;line-height:1}
.logo .hrt{color:var(--accent);font-style:normal;font-size:16px;display:inline-block;transform:translateY(-8px) rotate(12deg);margin-left:2px}
.live{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.live.demo::before{background:var(--c-casa)}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

.mesnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px}
.mesnav h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;margin:0;letter-spacing:-.3px}
.mesnav h2 span{color:var(--muted);font-weight:600}
.mesnav .arrows{display:flex;gap:8px}

/* resumo */
.resumo{background:var(--ink);color:var(--bg);border-radius:24px;padding:18px 18px 16px;position:relative;overflow:hidden}
.resumo::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--accent);opacity:.9}
.resumo::before{content:"";position:absolute;right:62px;top:58px;width:26px;height:26px;border-radius:50%;background:var(--c-casa);z-index:1}
.resumo .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;position:relative;z-index:2}
.resumo .big{font-family:'Fraunces',serif;font-weight:700;font-size:42px;letter-spacing:-1px;margin:2px 0 14px;position:relative;z-index:2}
.resumo .big small{font-size:20px;opacity:.6;margin-right:4px}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.resumo .row{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.resumo .row b{font-family:'JetBrains Mono',monospace;font-size:14px;display:block;margin-top:2px;opacity:1}
.resumo .row span{opacity:.75}
.resumo .row span b{opacity:1}
.resumo .row .falta b{color:var(--accent)}
.aviso{margin-top:12px;font-size:12.5px;background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:12px;padding:8px 10px;position:relative;z-index:2}

/* donos */
.donos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}
.dono{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 9px;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.dono:active{transform:scale(.97)}
.dono.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.dono .n{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.dono .n::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.dono .t{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:6px}
.dono .f{font-size:11.5px;color:var(--muted);margin-top:1px}
.dono .f.zero{color:var(--ok)}

/* lista */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sec h3{margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.sec h3 em{font-style:normal;color:var(--muted);font-family:'DM Sans';font-size:13px;font-weight:500;margin-left:6px}
.sec button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:opacity .2s,transform .15s}
.item:active{transform:scale(.985)}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.item .info{flex:1;min-width:0}
.item .nome{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px}
.item .sub .late{color:var(--late);font-weight:700}
.item .sub .pill{background:var(--soft);border-radius:6px;padding:0 6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink)}
.item .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;white-space:nowrap}
.semvalor{font-family:'DM Sans';font-size:12.5px;font-weight:700;color:var(--accent);border:1.5px dashed var(--accent);border-radius:10px;padding:4px 8px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;transition:all .2s}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .2s}
.item.pago{opacity:.62}
.item.pago .nome{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--muted)}
.item.pago .check{background:var(--ok);border-color:var(--ok);color:#fff}
.item.pago .check svg{opacity:1;transform:scale(1)}
.item.late{border-color:color-mix(in srgb,var(--late) 45%,var(--line))}

.vazio{background:var(--card);border:1.5px dashed var(--line);border-radius:20px;padding:22px 18px;text-align:center;margin-top:18px}
.vazio h4{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px}
.vazio p{color:var(--muted);margin:0 0 14px;font-size:14px}
.tudo-pago{text-align:center;padding:16px;color:var(--muted);font-size:14px}
.tudo-pago b{display:block;font-family:'Fraunces',serif;font-style:italic;font-size:20px;color:var(--ok);margin-bottom:2px}

/* botão + */
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;border:0;background:var(--accent);color:#fff;box-shadow:0 12px 24px -10px var(--accent);display:grid;place-items:center;z-index:20;transition:transform .15s}
.fab:active{transform:scale(.92) rotate(-8deg)}
.fab svg{width:28px;height:28px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.on{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,15,.45);animation:fade .2s}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-card h3{font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin:2px 0 4px;letter-spacing:-.4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;min-height:1em}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 0}
input[type=text],input[type=email],input[type=password],input:not([type]){display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;outline:none}
input:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flabel{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-size:13.5px;font-weight:700;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[style].on{background:var(--c);border-color:var(--c);color:#fff}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:16px 0 4px;font-weight:700}
.sw input{width:22px;height:22px;accent-color:var(--ok)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:700;font-size:15.5px;margin-top:10px}
.btn.pri{background:var(--ink);color:var(--bg);margin-top:18px}
.btn.acc{background:var(--accent);color:#fff}
.btn.ghost{background:var(--soft)}
.btn.danger{background:transparent;color:var(--late)}
.rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.r .d{width:9px;height:9px;border-radius:3px;background:var(--c);transform:rotate(45deg);flex:none}
.r .x{flex:1;min-width:0}
.r .x b{display:block;font-size:14px}
.r .x span{font-size:12px;color:var(--muted)}
.r .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}
.nota{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:14px}

/* toast + confete */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* abas */
.abas{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0 0}
.abas button{flex:1;border:0;background:transparent;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.abas button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.abas em{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:6px}

/* olho */
.resumo .topo{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.olho{border:0;background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);width:30px;height:26px;border-radius:9px;display:grid;place-items:center}
.olho svg{width:16px;height:16px}

/* mercado */
.add-merc{display:flex;gap:8px;margin:16px 0 4px}
.add-merc input{margin-top:0!important;flex:1}
.add-merc button{flex:none;width:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center}
.add-merc button svg{width:22px;height:22px}
.dica{font-size:12px;color:var(--muted);margin:2px 2px 0}
.mi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 8px 11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:opacity .2s,transform .15s}
.mi:active{transform:scale(.985)}
.mi .x{flex:1;min-width:0}
.mi .x b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .x small{font-size:11.5px;color:var(--muted)}
.mi .del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:10px;flex:none}
.mi.ok{opacity:.55}
.mi.ok .x b{text-decoration:line-through;text-decoration-color:var(--muted)}
.mi.ok .check{background:var(--ok);border-color:var(--ok);color:#fff}
.mi.ok .check svg{opacity:1;transform:scale(1)}

/* bloqueio */
#trava{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
#trava.on{display:flex}
#trava .cad{width:74px;height:74px;border-radius:24px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-bottom:8px}
#trava .cad svg{width:34px;height:34px}
#trava .logo{font-size:30px}
#trava p{color:var(--muted);margin:0 0 10px;min-height:1.2em;font-size:14px}
#trava .btn{max-width:280px}
#trava .link{border:0;background:none;color:var(--muted);font-size:13.5px;text-decoration:underline;margin-top:6px;padding:8px}

/* novidades */
.topo-btns{display:flex;gap:8px}
.sino{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.novas{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;padding:11px 14px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--card));text-align:left;font-size:14px}
.novas span{margin-left:auto;font-weight:700;color:var(--accent);font-size:13px}
.atvs{display:flex;flex-direction:column}
.atv{padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.atv:last-child{border-bottom:0}
.atv small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.atv.nova{position:relative;padding-left:14px}
.atv.nova::before{content:"";position:absolute;left:0;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cf{position:fixed;top:-20px;z-index:70;pointer-events:none;font-size:22px;animation:cair linear forwards}
@keyframes cair{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.login .logo{font-size:38px;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 20px}
.err{color:var(--late);font-size:13px;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="trava">
  <div class="cad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
  <div class="logo">nossas coisinhas<span class="hrt">♥</span></div>
  <p id="trava-msg">Toque para desbloquear</p>
  <button class="btn pri" id="trava-btn">Desbloquear com Face ID</button>
  <button class="link" id="trava-senha">Entrar com a senha</button>
</div>

<script>
/* ===== CONFIGURAÇÃO — cole aqui o firebaseConfig do seu projeto ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA9t6H2JaX1Xf8DsXFs1nSoBMaUoJ5ZwkU",
  authDomain: "nossascoisinhas-b5fdf.firebaseapp.com",
  projectId: "nossascoisinhas-b5fdf",
  storageBucket: "nossascoisinhas-b5fdf.firebasestorage.app",
  messagingSenderId: "83967630202",
  appId: "1:83967630202:web:a38d08ffd44ac014e594c3"
};
/* ==================================================================== */

const DEMO = !FIREBASE_CONFIG.apiKey;
const DOMINIO_LOGIN = '@nossascoisinhas.com'; // no login basta digitar o nome; o app completa o resto
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- datas e números ---------- */
const hoje = new Date();
const ymDe = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
const HOJE_YM = ymDe(hoje);
function addMeses(ym, n){ const [y,m] = ym.split('-').map(Number); return ymDe(new Date(y, m-1+n, 1)); }
function difMeses(a, b){ const [ya,ma] = a.split('-').map(Number), [yb,mb] = b.split('-').map(Number); return (yb-ya)*12 + (mb-ma); }
function nomeMes(ym){ const [y,m] = ym.split('-').map(Number); return MESES[m-1] + ' ' + y; }
function diasNoMes(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function dataVenc(ym, dia){ const d = Math.min(dia, diasNoMes(ym)); return String(d).padStart(2,'0') + '/' + ym.slice(5); }
const hojeBR = () => { const d = new Date(); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); };
function dinheiro(v, semCentavo){
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits: semCentavo && n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2});
}
function lerValor(s){
  s = String(s || '').replace(/[R$\s]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isNaN(n) ? null : Math.round(n * 100) / 100;
}
const lerInt = s => { const n = parseInt(s, 10); return isNaN(n) ? null : n; };

/* ---------- camada de dados ---------- */
function LocalDB(){
  const KEY = 'nossas_coisinhas_demo';
  let d; try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  d = d || {};
  ['contas','itens','meses','config','atividade','mercado'].forEach(k => d[k] = d[k] || {});
  const subs = new Set(); let t = null;
  const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {} clearTimeout(t); t = setTimeout(() => subs.forEach(f => f()), 0); };
  const sub = f => { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  const cl = o => JSON.parse(JSON.stringify(o));
  const lista = (col, filtro) => Object.entries(d[col]).filter(([,v]) => !filtro || filtro(v)).map(([id,v]) => ({id, ...v}));
  const escrever = (col, id, data, merge) => { d[col][id] = merge ? {...(d[col][id] || {}), ...cl(data)} : cl(data); };
  return {
    watchContas: cb => sub(() => cb(lista('contas'))),
    watchItens: (ym, cb) => sub(() => cb(lista('itens', v => v.mes === ym))),
    watchMes: (ym, cb) => sub(() => cb(d.meses[ym] || {})),
    watchConfig: cb => sub(() => cb(d.config.geral || {})),
    watchAtividade: cb => sub(() => cb(lista('atividade').sort((a, b) => b.em - a.em).slice(0, 60))),
    watchMercado: cb => sub(() => cb(lista('mercado'))),
    async add(col, data){ d[col][Math.random().toString(36).slice(2, 12)] = cl(data); salvar(); },
    novoId: () => Math.random().toString(36).slice(2, 12),
    async set(col, id, data, merge){ escrever(col, id, data, merge); salvar(); },
    async del(col, id){ delete d[col][id]; salvar(); },
    async criarSeNaoExiste(col, id, data){ if (!d[col][id]) { d[col][id] = cl(data); salvar(); } },
    async lote(ops){ ops.forEach(o => o.del ? delete d[o.col][o.id] : escrever(o.col, o.id, o.data, o.merge)); salvar(); },
    async removerDoMes(ym, contaId, itemId){
      const m = d.meses[ym] || {}; m.removidos = [...new Set([...(m.removidos || []), contaId])]; d.meses[ym] = m;
      delete d.itens[itemId]; salvar();
    },
    async itensDaConta(id){ return lista('itens', v => v.contaId === id); },
    limpar(){ localStorage.removeItem(KEY); location.reload(); }
  };
}

function FireDB(){
  const db = firebase.firestore();
  try { db.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch(e) {}
  const map = s => s.docs.map(x => ({id: x.id, ...x.data()}));
  const erro = e => toast('Erro: ' + (e.code || e.message));
  return {
    watchContas: cb => db.collection('contas').onSnapshot(s => cb(map(s)), erro),
    watchItens: (ym, cb) => db.collection('itens').where('mes', '==', ym).onSnapshot(s => cb(map(s)), erro),
    watchMes: (ym, cb) => db.collection('meses').doc(ym).onSnapshot(s => cb(s.exists ? s.data() : {}), erro),
    watchConfig: cb => db.collection('config').doc('geral').onSnapshot(s => cb(s.exists ? s.data() : {}), erro),
    watchAtividade: cb => db.collection('atividade').orderBy('em', 'desc').limit(60).onSnapshot(s => cb(map(s)), erro),
    watchMercado: cb => db.collection('mercado').onSnapshot(s => cb(map(s)), erro),
    add: (col, data) => db.collection(col).add(data),
    novoId: () => db.collection('_').doc().id,
    set: (col, id, data, merge) => db.collection(col).doc(id).set(data, {merge: !!merge}),
    del: (col, id) => db.collection(col).doc(id).delete(),
    criarSeNaoExiste: (col, id, data) => {
      const r = db.collection(col).doc(id);
      return db.runTransaction(async t => { const s = await t.get(r); if (!s.exists) t.set(r, data); });
    },
    lote: ops => {
      const b = db.batch();
      ops.forEach(o => { const r = db.collection(o.col).doc(o.id); o.del ? b.delete(r) : b.set(r, o.data, {merge: !!o.merge}); });
      return b.commit();
    },
    removerDoMes: (ym, contaId, itemId) => {
      const b = db.batch();
      b.set(db.collection('meses').doc(ym), {removidos: firebase.firestore.FieldValue.arrayUnion(contaId)}, {merge: true});
      b.delete(db.collection('itens').doc(itemId));
      return b.commit();
    },
    itensDaConta: async id => map(await db.collection('itens').where('contaId', '==', id).get())
  };
}

/* ---------- geração automática do mês ---------- */
function itemDaConta(c, ym){
  if (!c.inicio || ym < c.inicio) return null;
  if (c.fim && ym > c.fim) return null;
  let parcela = null;
  if (c.tipo === 'parcelada'){
    parcela = (c.parcelaInicial || 1) + difMeses(c.inicio, ym);
    if (parcela > c.parcelas) return null;
  }
  return {
    mes: ym, contaId: c.id, nome: c.nome, dono: c.dono || 'casa', tipo: c.tipo, dia: c.dia || null,
    valor: c.tipo === 'variavel' ? null : (Number(c.valor) || 0),
    parcela, parcelas: c.tipo === 'parcelada' ? c.parcelas : null,
    pago: false, criadoEm: Date.now()
  };
}
function sincronizar(){
  const {ok} = state;
  if (!ok.contas || !ok.itens || !ok.mes) return;
  const ym = state.ym;
  const existe = new Set(state.itens.map(i => i.contaId).filter(Boolean));
  const removidos = new Set(state.mes.removidos || []);
  state.contas.forEach(c => {
    if (existe.has(c.id) || removidos.has(c.id)) return;
    const it = itemDaConta(c, ym); if (!it) return;
    const id = ym + '_' + c.id;
    if (criando.has(id)) return;
    criando.add(id);
    DB.criarSeNaoExiste('itens', id, it).finally(() => criando.delete(id));
  });
}

function assinarMes(){
  unsubMes.forEach(f => f()); unsubMes = [];
  state.ok.itens = state.ok.mes = false; state.itens = []; state.mes = {}; pendAnterior = null;
  const ym = state.ym;
  unsubMes.push(DB.watchItens(ym, l => { if (ym !== state.ym) return; state.itens = l; state.ok.itens = true; sincronizar(); render(); }));
  unsubMes.push(DB.watchMes(ym, m => { if (ym !== state.ym) return; state.mes = m; state.ok.mes = true; sincronizar(); }));
  render();
}

function quando(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'agora';
  if (s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
  const d = new Date(ms), h = new Date();
  const hora = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === h.toDateString()) return 'hoje ' + hora;
  const ontem = new Date(h); ontem.setDate(h.getDate() - 1);
  if (d.toDateString() === ontem.toDateString()) return 'ontem ' + hora;
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hora;
}
let idsAtiv = null;
function assinarAtividade(){
  if (!localStorage.getItem(chaveVisto())) localStorage.setItem(chaveVisto(), String(Date.now()));
  DB.watchAtividade(l => {

      else if (deles.length > 1) toast(`${deles[0].quem} fez ${deles.length} alterações`, 3800);
    }
    idsAtiv = new Set(l.map(a => a.id));
    state.atividade = l; render();
  });
}

/* ---------- bloqueio com Face ID (WebAuthn / chave de acesso) ---------- */
const TRAVA_KEY = 'nc_trava_cred';
const travaAtiva = () => !!localStorage.getItem(TRAVA_KEY);
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
let travado = false, escondidoEm = 0, desbloqueando = false;

async function ativarTrava(){
  if (!window.PublicKeyCredential || !navigator.credentials) return toast('Este aparelho não tem suporte');
  try {
    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name: 'Nossas Coisinhas'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: (user && user.email) || 'coisinhas', displayName: meuNome()},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'},
      timeout: 60000, attestation: 'none'
    }});
    localStorage.setItem(TRAVA_KEY, b64(cred.rawId));
    toast('Bloqueio ativado 🔒');
  } catch(e){ toast('Não foi possível ativar o bloqueio'); }
}
function desativarTrava(){ localStorage.removeItem(TRAVA_KEY); toast('Bloqueio desativado'); }

function mostrarTrava(){
  $('#trava').classList.toggle('on', travado);
  $('#trava-senha').style.display = DEMO ? 'none' : '';
}
function travar(){
  if (!travaAtiva()) return;
  travado = true; fecharSheet(); mostrarTrava();
  $('#trava-msg').textContent = 'Toque para desbloquear';
}
async function desbloquear(automatico){
  if (desbloqueando) return;
  desbloqueando = true;
  try {
    await navigator.credentials.get({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{type: 'public-key', id: unb64(localStorage.getItem(TRAVA_KEY))}],
      userVerification: 'required', timeout: 60000
    }});
    travado = false; mostrarTrava();
  } catch(e){
    if (!automatico) $('#trava-msg').textContent = 'Não deu certo. Toque para tentar de novo.';
  } finally { desbloqueando = false; }
}
$('#trava-btn').onclick = () => desbloquear(false);
$('#trava-senha').onclick = () => { if (!DEMO) firebase.auth().signOut().then(() => location.reload()); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ escondidoEm = Date.now(); return; }
  if (travaAtiva() && !travado && escondidoEm && Date.now() - escondidoEm > 60000){ travar(); desbloquear(true); }
});

function iniciar(){
  if (travaAtiva() && !sessionStorage.getItem('nc_destravado')){ travar(); desbloquear(true); }
  assinarAtividade();
  DB.watchMercado(l => { state.mercado = l; render(); });
  DB.watchConfig(c => { state.config = c; render(); });
  DB.watchContas(l => { state.contas = l; state.ok.contas = true; sincronizar(); render(); });
  assinarMes();
}

/* ---------- render principal ---------- */
function atrasada(it){
  if (it.pago || !it.dia) return false;
  if (state.ym < HOJE_YM) return true;
  if (state.ym > HOJE_YM) return false;
  return Math.min(it.dia, diasNoMes(state.ym)) < hoje.getDate();
}
function ordenar(a, b){ return (a.dia || 99) - (b.dia || 99) || a.nome.localeCompare(b.nome); }

function cardItem(it){
  const sub = [];
  if (it.dia) sub.push(atrasada(it) ? `<span class="late">atrasada · ${dataVenc(state.ym, it.dia)}</span>` : `vence ${dataVenc(state.ym, it.dia)}`);
  if (it.parcela) sub.push(`<span class="pill">${it.parcela}/${it.parcelas}</span>`);
  sub.push(esc(nomeDono(it.dono)));
  if (it.tipo === 'variavel') sub.push('fatura');
  if (it.pago && it.pagoPor) sub.push('pago por ' + esc(it.pagoPor));
  return `<div class="item ${it.pago ? 'pago' : ''} ${atrasada(it) ? 'late' : ''}" data-id="${it.id}" style="--c:${corDono(it.dono)}">
    <div class="info"><div class="nome">${esc(it.nome)}</div><div class="sub">${sub.join('<span>·</span>')}</div></div>
    <div class="val">${it.valor == null ? '<span class="semvalor">+ valor</span>' : mostra(it.valor, true)}</div>
    <button class="check" data-check aria-label="Marcar como pago">${I.check}</button>
  </div>`;
}

  const soma = l => l.reduce((s, i) => s + (Number(i.valor) || 0), 0);
  const total = soma(itens), pago = soma(itens.filter(i => i.pago)), falta = total - pago;
  const pct = total ? Math.round(pago / total * 100) : 0;
  const semValor = itens.filter(i => i.valor == null && !i.pago).length;
  const atras = itens.filter(atrasada).length;
  const nNovas = naoVistas().length;

  // celebração quando zera
  if (state.ok.itens){
    if (pendAnterior !== null && pendAnterior > 0 && falta <= 0 && total > 0 && semValor === 0) confete();
    pendAnterior = falta + semValor;

/* ---------- lista de mercado ---------- */
function telaMercado(){
  const l = state.mercado;
  const falta = l.filter(m => !m.feito).sort((a, b) => a.criadoEm - b.criadoEm);
  const carrinho = l.filter(m => m.feito).sort((a, b) => (b.feitoEm || 0) - (a.feitoEm || 0));
  const quemTxt = n => n && n !== meuNome() ? esc(n) : 'você';
  const linha = m => `<div class="mi ${m.feito ? 'ok' : ''}" data-merc="${m.id}">
      <button class="check" aria-label="Pegar">${I.check}</button>
      <div class="x"><b>${esc(m.nome)}</b><small>${m.feito ? 'pego por ' + quemTxt(m.feitoPor) : 'por ' + quemTxt(m.quem)}</small></div>
      <button class="del" data-mdel="${m.id}" aria-label="Tirar da lista">×</button></div>`;
  return `
    <div class="add-merc">
      <input id="m-novo" placeholder="O que precisa comprar?" enterkeyhint="done" autocomplete="off">
      <button data-acao="addMerc" aria-label="Adicionar">${I.mais}</button>
    </div>
    <div class="dica">Dica: dá pra colocar vários de uma vez, separados por vírgula.</div>
    ${!l.length ? `<div class="vazio"><h4>Lista vazia 🛒</h4><p>Escreve aí em cima o que está faltando em casa. O que um coloca, o outro vê na hora.</p></div>` : `
    <div class="sec"><h3>Comprar<em>${falta.length}</em></h3></div>
    <div class="lista">${falta.length ? falta.map(linha).join('') : '<div class="tudo-pago"><b>tudo no carrinho!</b>pode ir pro caixa ✨</div>'}</div>
    ${carrinho.length ? `<div class="sec"><h3>No carrinho<em>${carrinho.length}</em></h3><button data-acao="limparMerc">limpar comprados</button></div>
    <div class="lista">${carrinho.map(linha).join('')}</div>` : ''}`}`;
}
async function addMercado(){
  const inp = $('#m-novo'); if (!inp) return;
  const nomes = inp.value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  if (!nomes.length) return;
  inp.value = ''; inp.focus();
  const ops = [], novos = [], agora = Date.now();
  nomes.forEach((n, i) => {
    const igual = state.mercado.find(m => m.nome.toLowerCase() === n.toLowerCase());
    if (igual && !igual.feito) return;                       // já está na lista
    if (igual){ ops.push({col: 'mercado', id: igual.id, data: {feito: false, criadoEm: agora + i, quem: meuNome(), uid: meuUid()}, merge: true}); novos.push(n); return; }
    ops.push({col: 'mercado', id: DB.novoId(), data: {nome: n.charAt(0).toUpperCase() + n.slice(1), feito: false, quem: meuNome(), uid: meuUid(), criadoEm: agora + i}});
    novos.push(n);
  });
  if (!ops.length) return toast('Já está na lista');
  await DB.lote(ops);
  registrar(novos.length === 1 ? `colocou ${novos[0]} na lista do mercado` : `colocou ${novos.length} itens na lista do mercado`);
}
async function limparMercado(){
  const feitos = state.mercado.filter(m => m.feito);
  if (!feitos.length) return;
  if (!confirm(`Tirar ${feitos.length} ${feitos.length > 1 ? 'itens comprados' : 'item comprado'} da lista?`)) return;
  await DB.lote(feitos.map(m => ({col: 'mercado', id: m.id, del: true})));
  toast('Lista limpa ✓');
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  if (!DB || e.target.closest('#sheet')) return;
  const el = e.target.closest('[data-acao],[data-mes],[data-filtro],[data-check],[data-aba],[data-mdel],[data-merc],.item');
  if (!el) return;
  if (el.dataset.aba){ state.aba = el.dataset.aba; localStorage.setItem('nc_aba', state.aba); render(); window.scrollTo({top: 0}); return; }
  if (el.dataset.mdel){ DB.del('mercado', el.dataset.mdel); return; }
  if (el.dataset.merc){
    const m = state.mercado.find(x => x.id === el.dataset.merc); if (!m) return;
    DB.set('mercado', m.id, {feito: !m.feito, feitoEm: Date.now(), feitoPor: meuNome()}, true); return;
  }
  if (el.dataset.mes){ state.ym = addMeses(state.ym, +el.dataset.mes); state.filtro = 'tudo'; assinarMes(); window.scrollTo({top: 0}); return; }
  if (el.dataset.filtro){ state.filtro = state.filtro === el.dataset.filtro ? 'tudo' : el.dataset.filtro; render(); return; }
  if (el.hasAttribute('data-check')){ const it = state.itens.find(i => i.id === el.closest('.item').dataset.id); if (it) alternarPago(it); return; }
  if (el.classList.contains('item')){ const it = state.itens.find(i => i.id === el.dataset.id); if (it) sheetItem(it); return; }
  const a = el.dataset.acao;
  if (a === 'novo') sheetNovo();
  if (a === 'ajustes') sheetAjustes();
  if (a === 'novidades') sheetNovidades();
  if (a === 'addMerc') addMercado();
  if (a === 'limparMerc') limparMercado();
  if (a === 'olho'){ state.oculto = !state.oculto; localStorage.setItem('nc_oculto', state.oculto ? '1' : '0'); render(); }
  if (a === 'importar') importarOutubro();
  if (a === 'verPagas'){ state.verPagas = !state.verPagas; localStorage.setItem('nc_verPagas', state.verPagas ? '1' : '0'); render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'm-novo'){ e.preventDefault(); addMercado(); }
});

const FRASES = ['Menos uma! ✨','Riscado da lista ✓','Pago. Respira. 😮‍💨','Boa, time! 💪','Uma a menos pra pensar','Feito ✓'];
async function alternarPago(it){
  if (!it.pago && it.valor == null){ sheetItem(it, true); return; }
  const pago = !it.pago;
  await DB.set('itens', it.id, {pago, pagoEm: pago ? hojeBR() : null, pagoPor: pago ? quem() : null}, true);
  registrar(pago ? `marcou ${it.nome} como pago` : `desmarcou ${it.nome}`);
  if (pago) toast(FRASES[Math.floor(Math.random() * FRASES.length)]);
}

/* ---------- sheets ---------- */
function abrirSheet(html){
  const s = $('#sheet');
  s.innerHTML = `<div class="sheet-bg"></div><div class="sheet-card"><div class="grab"></div>${html}</div>`;
  s.classList.add('on');
  s.querySelector('.sheet-bg').onclick = fecharSheet;
  const card = s.querySelector('.sheet-card');
  card.querySelectorAll('.seg').forEach(sg => sg.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    sg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    card.dispatchEvent(new CustomEvent('seg', {detail: {nome: sg.dataset.seg, v: b.dataset.v}}));
  }));
  return card;
}
function fecharSheet(){ const s = $('#sheet'); s.classList.remove('on'); s.innerHTML = ''; }
const seg = (nome, opts, atual) => `<div class="seg" data-seg="${nome}">${opts.map(([v, l, c]) => `<button type="button" data-v="${v}" class="${v === atual ? 'on' : ''}" ${c ? `style="--c:${c}"` : ''}>${esc(l)}</button>`).join('')}</div>`;
const segVal = (r, n) => (r.querySelector(`[data-seg="${n}"] .on`) || {}).dataset?.v;
const val = (r, id) => r.querySelector('#' + id).value;
const TIPOS = {avulso: 'Só este mês', fixa: 'Todo mês', variavel: 'Valor varia', parcelada: 'Parcelada'};

function sheetItem(it, focarValor){
  const c = abrirSheet(`
    <h3>${esc(it.nome)}</h3>
    <p class="hint">${TIPOS[it.tipo] || 'Só este mês'}${it.parcela ? ` · parcela ${it.parcela} de ${it.parcelas}` : ''}${it.pago && it.pagoEm ? ` · pago em ${it.pagoEm}${it.pagoPor ? ' por ' + esc(it.pagoPor) : ''}` : ''}</p>
    <label>Valor ${it.contaId ? 'deste mês' : ''}<input id="f-valor" inputmode="decimal" placeholder="0,00" value="${it.valor == null ? '' : dinheiro(it.valor, true)}"></label>
    <div class="two">
      <label>Nome<input id="f-nome" value="${esc(it.nome)}"></label>
      <label>Vence dia<input id="f-dia" inputmode="numeric" value="${it.dia || ''}"></label>
    </div>
    <div class="flabel">De quem é</div>${seg('dono', donoOpts(), it.dono || 'casa')}
    <label class="sw"><input type="checkbox" id="f-pago" ${it.pago || focarValor ? 'checked' : ''}> Pago</label>
    <button class="btn pri" id="b-ok">Salvar</button>
    ${it.contaId ? '<button class="btn ghost" id="b-conta">Editar conta recorrente</button>' : ''}
    <button class="btn danger" id="b-rem">Remover deste mês</button>`);
  if (focarValor) setTimeout(() => c.querySelector('#f-valor').focus(), 300);
  c.querySelector('#b-ok').onclick = async () => {
    const pago = c.querySelector('#f-pago').checked;
    const valor = lerValor(val(c, 'f-valor'));
    if (pago && valor == null) return toast('Coloca o valor antes de marcar pago');
    const nome = val(c, 'f-nome').trim() || it.nome;
    await DB.set('itens', it.id, {
      valor, nome, dia: lerInt(val(c, 'f-dia')), dono: segVal(c, 'dono'), pago,
      pagoEm: pago ? (it.pago ? it.pagoEm || hojeBR() : hojeBR()) : null,
      pagoPor: pago ? (it.pago ? it.pagoPor || quem() : quem()) : null
    }, true);
    if (pago !== !!it.pago) registrar(pago ? `marcou ${nome} como pago` + (valor !== it.valor ? ` (R$ ${dinheiro(valor, true)})` : '') : `desmarcou ${nome}`);
    else if (valor !== it.valor) registrar(`colocou R$ ${dinheiro(valor, true)} em ${nome}`);
    else registrar(`editou ${nome}`);
    fecharSheet();
    if (pago && !it.pago) toast(FRASES[Math.floor(Math.random() * FRASES.length)]);
  };
  const bc = c.querySelector('#b-conta');
  if (bc) bc.onclick = () => { const ct = state.contas.find(x => x.id === it.contaId); ct ? sheetConta(ct) : toast('Conta não encontrada'); };
  c.querySelector('#b-rem').onclick = async () => {
    if (!confirm(`Remover "${it.nome}" de ${nomeMes(state.ym)}?` + (it.contaId ? '\nOs outros meses continuam normais.' : ''))) return;
    if (it.contaId) await DB.removerDoMes(state.ym, it.contaId, it.id); else await DB.del('itens', it.id);
    registrar(`removeu ${it.nome} deste mês`);
    fecharSheet(); toast('Removida');
  };
}

function sheetNovo(){
  const c = abrirSheet(`
    <h3>Nova conta</h3>
    ${seg('tipo', Object.entries(TIPOS), 'fixa')}
    <p class="hint" id="t-hint" style="margin-top:8px"></p>
    <label>Nome<input id="f-nome" placeholder="Ex.: Nubank, Mercado, Netflix"></label>
    <div class="flabel">De quem é</div>${seg('dono', donoOpts(), state.filtro !== 'tudo' ? state.filtro : 'casa')}
    <div class="two">
      <label><span id="l-valor">Valor</span><input id="f-valor" inputmode="decimal" placeholder="0,00"></label>
      <label>Vence dia<input id="f-dia" inputmode="numeric" placeholder="10"></label>
    </div>
    <div class="two" id="parc">
      <label>Parcela deste mês<input id="f-pa" inputmode="numeric" value="1"></label>
      <label>Total de parcelas<input id="f-pt" inputmode="numeric" placeholder="12"></label>
    </div>
    <button class="btn pri" id="b-ok">Adicionar</button>`);
  const dicas = {
    avulso: `Aparece só em ${nomeMes(state.ym)}.`,
    fixa: 'Repete todo mês com o mesmo valor. Dá pra ajustar o valor em um mês específico.',
    variavel: 'Repete todo mês e você digita o valor quando a fatura chegar. Ideal pra cartões e luz.',
    parcelada: 'Conta as parcelas sozinha (3/10, 4/10…) e some quando terminar.'
  };
  const upd = t => {
    c.querySelector('#t-hint').textContent = dicas[t];
    c.querySelector('#parc').style.display = t === 'parcelada' ? '' : 'none';
    c.querySelector('#l-valor').textContent = t === 'variavel' ? 'Valor deste mês' : t === 'parcelada' ? 'Valor da parcela' : 'Valor';
  };
  upd('fixa');
  c.addEventListener('seg', e => { if (e.detail.nome === 'tipo') upd(e.detail.v); });
  setTimeout(() => c.querySelector('#f-nome').focus(), 300);

  c.querySelector('#b-ok').onclick = async () => {
    const tipo = segVal(c, 'tipo'), nome = val(c, 'f-nome').trim(), dono = segVal(c, 'dono');
    const valor = lerValor(val(c, 'f-valor')), dia = lerInt(val(c, 'f-dia'));
    if (!nome) return toast('Dá um nome pra conta');
    if (dia != null && (dia < 1 || dia > 31)) return toast('Dia precisa ser entre 1 e 31');
    if (tipo !== 'variavel' && valor == null) return toast('Falta o valor');
    const ym = state.ym;
    if (tipo === 'avulso'){
      await DB.set('itens', DB.novoId(), {mes: ym, nome, dono, dia, valor, tipo: 'avulso', pago: false, criadoEm: Date.now()});
    } else {
      const conta = {nome, dono, tipo, dia, inicio: ym, criadoEm: Date.now()};
      if (tipo !== 'variavel') conta.valor = valor;
      if (tipo === 'parcelada'){
        const pa = lerInt(val(c, 'f-pa')) || 1, pt = lerInt(val(c, 'f-pt'));
        if (!pt || pa > pt) return toast('Confere as parcelas');
        conta.parcelaInicial = pa; conta.parcelas = pt;
      }
      const id = DB.novoId();
      const item = itemDaConta({id, ...conta}, ym);
      if (tipo === 'variavel') item.valor = valor;
      await DB.lote([{col: 'contas', id, data: conta}, {col: 'itens', id: ym + '_' + id, data: item}]);
    }
    registrar(`adicionou ${nome}` + (valor != null ? ` (R$ ${dinheiro(valor, true)})` : ''));
    fecharSheet(); toast('Adicionada ✓');
  };
}

function sheetConta(ct){
  const ym = state.ym;
  const parcAgora = ct.tipo === 'parcelada' ? (ct.parcelaInicial || 1) + difMeses(ct.inicio, ym) : null;
  const c = abrirSheet(`
    <h3>${esc(ct.nome)}</h3>
    <p class="hint">${TIPOS[ct.tipo]} · desde ${nomeMes(ct.inicio)}${ct.fim ? ' · até ' + nomeMes(ct.fim) : ''}. Mudanças valem daqui pra frente.</p>
    <label>Nome<input id="f-nome" value="${esc(ct.nome)}"></label>
    <div class="flabel">De quem é</div>${seg('dono', donoOpts(), ct.dono || 'casa')}
    <div class="two">
      ${ct.tipo !== 'variavel' ? `<label>${ct.tipo === 'parcelada' ? 'Valor da parcela' : 'Valor'}<input id="f-valor" inputmode="decimal" value="${dinheiro(ct.valor, true)}"></label>` : ''}
      <label>Vence dia<input id="f-dia" inputmode="numeric" value="${ct.dia || ''}"></label>
    </div>
    ${ct.tipo === 'parcelada' ? `<div class="two"><label>Parcela em ${MESES[+ym.slice(5) - 1]}<input id="f-pa" inputmode="numeric" value="${parcAgora}"></label><label>Total de parcelas<input id="f-pt" inputmode="numeric" value="${ct.parcelas}"></label></div>` : ''}
    <button class="btn pri" id="b-ok">Salvar</button>
    <button class="btn danger" id="b-fim">Encerrar a partir de ${nomeMes(ym)}</button>`);

  c.querySelector('#b-ok').onclick = async () => {
    const up = {nome: val(c, 'f-nome').trim() || ct.nome, dono: segVal(c, 'dono'), dia: lerInt(val(c, 'f-dia'))};
    if (ct.tipo !== 'variavel'){ const v = lerValor(val(c, 'f-valor')); if (v == null) return toast('Falta o valor'); up.valor = v; }
    if (ct.tipo === 'parcelada'){
      const pa = lerInt(val(c, 'f-pa')), pt = lerInt(val(c, 'f-pt'));
      if (!pa || !pt || pa > pt) return toast('Confere as parcelas');
      up.parcelas = pt;
      if (pa !== parcAgora){ up.inicio = ym; up.parcelaInicial = pa; }
    }
    const ops = [{col: 'contas', id: ct.id, data: up, merge: true}];
    const it = state.itens.find(i => i.contaId === ct.id);
    if (it && !it.pago){
      const novo = itemDaConta({...ct, ...up}, ym);
      if (novo){
        const d = {nome: novo.nome, dono: novo.dono, dia: novo.dia, parcela: novo.parcela, parcelas: novo.parcelas};
        if (ct.tipo !== 'variavel') d.valor = novo.valor;
        ops.push({col: 'itens', id: it.id, data: d, merge: true});
      }
    }
    await DB.lote(ops); registrar(`editou a conta ${up.nome}`); fecharSheet(); toast('Conta atualizada');
  };
  c.querySelector('#b-fim').onclick = async () => {
    if (!confirm(`Encerrar "${ct.nome}"?\nEla deixa de aparecer a partir de ${nomeMes(ym)}. Os meses anteriores ficam como estão.`)) return;
    const itens = await DB.itensDaConta(ct.id);
    const ops = [{col: 'contas', id: ct.id, data: {fim: addMeses(ym, -1)}, merge: true}];
    itens.filter(i => i.mes >= ym && !i.pago).forEach(i => ops.push({col: 'itens', id: i.id, del: true}));
    await DB.lote(ops); registrar(`encerrou a conta ${ct.nome}`); fecharSheet(); toast('Conta encerrada');
  };
}

    ['Condomínio','casa','fixa',10,310,1],

/* ---------- toast + confete ---------- */
let tt;
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms || 2200); }
function confete(){
  toast('Tudo pago esse mês! 🎉');
  const em = ['🎉','✨','💸','🥂','💛','🎊'];
  for (let i = 0; i < 28; i++){
    const s = document.createElement('span'); s.className = 'cf';
    s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    s.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
  }
}

/* ---------- login ---------- */
function telaLogin(){
  $('#app').innerHTML = `<form class="login wrap" id="l-form" action="#" method="post" autocomplete="on">
    <div class="logo">nossas coisinhas<span class="hrt">♥</span></div>
    <p>as contas da casa, organizadas a dois.</p>
    <label>Nome<input type="text" id="l-email" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ex.: timbira"></label>
    <label>Senha<input type="password" id="l-senha" name="password" autocomplete="current-password"></label>
    <label class="sw"><input type="checkbox" id="l-lembrar" checked> Manter conectado</label>
    <button class="btn pri" id="l-ok" type="submit">Entrar</button>
    <div class="err" id="l-err"></div></form>`;
  const go = async () => {
    $('#l-err').textContent = '';
    let login = $('#l-email').value.trim().toLowerCase();
    if (login && !login.includes('@')) login += DOMINIO_LOGIN;
    const P = firebase.auth.Auth.Persistence;
    try {
      await firebase.auth().setPersistence($('#l-lembrar').checked ? P.LOCAL : P.SESSION);
      sessionStorage.setItem('nc_destravado', '1'); // acabou de digitar a senha: não pede Face ID de novo agora
      await firebase.auth().signInWithEmailAndPassword(login, $('#l-senha').value);
    }
    catch(e){ sessionStorage.removeItem('nc_destravado'); $('#l-err').textContent =({'auth/wrong-password': 'Senha incorreta', 'auth/user-not-found': 'Usuário não encontrado', 'auth/invalid-email': 'Nome inválido', 'auth/invalid-credential': 'Nome ou senha incorretos', 'auth/too-many-requests': 'Muitas tentativas, espera um pouco'})[e.code] || e.message; }
  };
  $('#l-form').onsubmit = e => { e.preventDefault(); go(); };
}

if (DEMO || typeof firebase === 'undefined'){
  DB = LocalDB(); iniciar();
} else {

  firebase.auth().onAuthStateChanged(u => {
    if (u){ user = u; if (!DB){ DB = FireDB(); iniciar(); } }
    else { user = null; telaLogin(); }
  });
}
